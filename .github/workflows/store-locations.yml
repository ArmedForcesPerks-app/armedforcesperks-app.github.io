# Refreshes data/locations.json (stores for the app's "Near me" map) from OpenStreetMap.
# Free: runs on GitHub Actions (free for public repositories) and the public Overpass API.
#
# - Checked daily at 04:17 UTC (a quiet time for the public servers); a full download happens
#   once the list is 27 days old. On other days it only fills in chains the last run couldn't
#   get (listed in data/locations-status.json), if any. Or any time from Actions > Store locations > Run workflow.
# - If the public servers are too busy, the run ends quietly (no failure email) and the next
#   day's run tries again. It only fails (and emails) if the list gets over 40 days old.
# - Pull requests that change tools/store-locations/ run the tests and a trial download
#   without publishing anything.
# - If a chain suddenly loses more than half its stores, last month's stores are kept for it
#   and the run summary says so. If the whole list collapses, nothing is published and the
#   run fails (GitHub emails the repository owner).
# - Local shops (tools/local-shops/shops.json, hand-checked) are rechecked about once a month:
#   each shop's own offer page is read again, and a shop whose page stops showing the offer two
#   months running leaves the map (data/local-shops-status.json keeps the count).
name: Store locations

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      fill:
        description: 'Only download the chains the last run missed'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'tools/store-locations/**'
      - 'tools/local-shops/**'
      - '.github/workflows/store-locations.yml'

# Nothing by default; each job below gets only what it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
      checks: write # post the "Store locations report" check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, so the job's GitHub token isn't left on disk.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test tools/store-locations/test.mjs
      # A quick check with three chains (Regal and AMC among them, to check their participating-theatre lists) that the download still works (all chains if the pull
      # request has the "full store trial" label). It's a heads-up only: the free map servers
      # are sometimes busy, so a failed trial doesn't fail the check (and doesn't email anyone).
      # The "Store locations report" check shows what happened.
      - name: Get store-locator data for the full trial
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full store trial')
        continue-on-error: true
        timeout-minutes: 100
        run: python3 tools/store-locations/atp-extract.py atp-stores.geojson
      - name: Trial download (nothing is published)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 80
        env:
          ONLY: ${{ !contains(github.event.pull_request.labels.*.name, 'full store trial') && '--only homedepot,regal,amc' || '' }}
        run: node tools/store-locations/build.mjs --dry-run $ONLY --atp atp-stores.geojson --budget-min 70 --report report.md
      - name: Post the run report as a check
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request
          text = open('report.md', encoding='utf-8').read()[:60000]
          body = {'name': 'Store locations report', 'head_sha': os.environ['SHA'], 'status': 'completed',
                  'conclusion': 'neutral', 'output': {'title': 'Store download', 'summary': text.splitlines()[2] if len(text.splitlines()) > 2 else text[:200], 'text': text}}
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
                                       data=json.dumps(body).encode(), method='POST',
                                       headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          print(urllib.request.urlopen(req).status)
          PY

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 260
    permissions:
      contents: write # commit the new store list
      pages: write # ask GitHub Pages to rebuild the site
      checks: write # post the "Store locations report" check
    # Only one publish at a time; a second one waits instead of cancelling the first.
    concurrency:
      group: store-locations-publish
      cancel-in-progress: false
    env:
      # Scheduled runs download everything only once the list is 27 days old.
      IF_OLDER: ${{ github.event_name == 'schedule' && '--if-older-than 27' || '' }}
      FILL: ${{ inputs.fill && '--fill' || '' }}
    steps:
      # "Commit if changed" pushes with the checkout's sign-in, so it stays set up. Nothing is
      # uploaded as an artifact and no packages are installed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # zizmor: ignore[artipacked]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Anything to do today?
        id: due
        run: node tools/store-locations/build.mjs --should-run $IF_OLDER
      # Each chain's own store-locator data (All the Places), used to add stores OpenStreetMap is
      # missing and to check pins. If it's unavailable, the list is built from OpenStreetMap alone.
      - name: Get store-locator data
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 100
        run: python3 tools/store-locations/atp-extract.py atp-stores.geojson
      # Re-reads each local shop's offer page (skipped if it was done in the last 20 days).
      - name: Check local shops' offers
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: python3 tools/local-shops/recheck.py
      - name: Build store list
        if: steps.due.outputs.run == 'true'
        run: node tools/store-locations/build.mjs --atp atp-stores.geojson --budget-min 120 --soft-fail-days 40 $IF_OLDER $FILL --report report.md
      - name: Post the run report as a check
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request
          text = open('report.md', encoding='utf-8').read()[:60000]
          body = {'name': 'Store locations report', 'head_sha': os.environ['SHA'], 'status': 'completed',
                  'conclusion': 'neutral', 'output': {'title': 'Store download', 'summary': text.splitlines()[2] if len(text.splitlines()) > 2 else text[:200], 'text': text}}
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
                                       data=json.dumps(body).encode(), method='POST',
                                       headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          print(urllib.request.urlopen(req).status)
          PY
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/locations.json ]; then
            echo "No store list yet (the servers were busy). The next run will try again."
            exit 0
          fi
          git add data/locations.json
          for f in data/locations-status.json data/local-shops-status.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update store locations from OpenStreetMap"
          # The download takes about 45 minutes, and main may have moved on meanwhile
          # (for example the nightly deal sync), so catch up before pushing.
          pushed=""
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push; then pushed=1; break; fi
            sleep 20
          done
          [ -n "$pushed" ] || { echo "Couldn't push the store list."; exit 1; }
          # Ask GitHub Pages to rebuild the site (a push from this job may not start it on its own).
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" || true
